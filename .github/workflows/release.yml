name: Release

# Triggered by pushing a version tag, e.g. `git tag v1.2.3 && git push origin v1.2.3`.
# Builds self-contained, single-file binaries for Windows and Linux and attaches them
# to a GitHub Release. The version shown in the app comes from this tag (via MinVer).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Publish (Windows x64)
        run: >
          dotnet publish src/ApiClient.App/ApiClient.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/win-x64

      - name: Publish (Linux x64)
        run: >
          dotnet publish src/ApiClient.App/ApiClient.App.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/linux-x64

      - name: Package
        run: |
          cd out/win-x64 && zip -r "../../ApiClient-${{ github.ref_name }}-win-x64.zip" . && cd ../..
          tar -czf "ApiClient-${{ github.ref_name }}-linux-x64.tar.gz" -C out/linux-x64 .

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ApiClient-${{ github.ref_name }}-win-x64.zip
            ApiClient-${{ github.ref_name }}-linux-x64.tar.gz
